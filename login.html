<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta Aero-Planes.">
    <title>Entrar | Aero-Planes</title>
    <style>
        :root {
            color-scheme: light;
            --navy: #10233f;
            --blue: #1769e0;
            --ink: #17243a;
            --muted: #64748b;
            --line: #dce5f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            color: var(--ink);
            background: linear-gradient(135deg, #eef5ff, #f8fafc 58%, #e6f0ff);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .login-card {
            width: min(100%, 430px);
            padding: 38px;
            border: 1px solid #e6ebf2;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 20px 60px rgba(16, 35, 63, 0.1);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--navy);
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 12px;
            color: #fff;
            background: var(--blue);
            font-size: 1.2rem;
        }

        h1 {
            margin: 30px 0 8px;
            color: var(--navy);
            font-size: 2rem;
            letter-spacing: -0.05em;
        }

        .intro {
            margin: 0 0 26px;
            color: var(--muted);
            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.88rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 9px;
            outline: none;
            color: var(--ink);
            background: #fbfcfe;
            font: inherit;
        }

        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.14);
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 9px;
            color: #fff;
            background: var(--blue);
            cursor: pointer;
            font: inherit;
            font-weight: 750;
        }

        button:hover {
            background: #1056bd;
        }

        .notice {
            margin: 17px 0 0;
            padding: 12px;
            border-radius: 9px;
            color: #42526b;
            background: #f0f5fc;
            font-size: 0.84rem;
            line-height: 1.55;
        }

        .status {
            margin: 14px 0 0;
            color: #9a3412;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 23px;
            color: var(--blue);
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <a class="brand" href="pagina-inicial.html">
            <span class="brand-mark" aria-hidden="true">✈</span>
            <span>Aero-Planes</span>
        </a>
        <h1>Bem-vindo de volta</h1>
        <p class="intro">Entre na sua conta para continuar.</p>

        <form id="login-form">
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
            </div>
            <button type="submit">Entrar</button>
            <p class="status" id="status" role="status" aria-live="polite" hidden></p>
        </form>

        <p class="notice">Esta é uma tela demonstrativa. A autenticação ainda não está conectada a um serviço e nenhuma informação é enviada.</p>
        <a class="back-link" href="pagina-inicial.html">← Voltar para a página inicial</a>
    </main>

    <script>
        document.querySelector("#login-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const status = document.querySelector("#status");
            status.textContent = "Não foi possível entrar: o serviço de autenticação ainda não está configurado.";
            status.hidden = false;
        });
    </script>
</body>
</html>
